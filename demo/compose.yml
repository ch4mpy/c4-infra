# The shared stack on the demo host: Caddy (TLS with Let's Encrypt, one site per application),
# Keycloak on its own PostgreSQL, Mailpit, RabbitMQ and Grafana LGTM. Plain HTTP inside the Docker
# network. Variables come from ./.env, written by .github/workflows/deploy-demo.yml; the Keycloak
# image is built by that workflow and pulled from GHCR. Each application deploys its own compose
# project, whose containers join the c4-infra network, and registers itself with ./register-app.sh.
name: c4-infra

# The default json-file driver never rotates: on a host that runs for months this is the most
# likely way for the demo to fall over. Every service below references this anchor.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: 10m
    max-file: '3'

networks:
  default:
    name: c4-infra

volumes:
  caddy_data:
  caddy_config:
  keycloak_db:
  mailpit_data:
  rabbitmq_data:
  grafana_data:

services:
  reverse-proxy:
    image: caddy:2.11.4-alpine
    container_name: c4-infra.reverse-proxy
    restart: unless-stopped
    logging: *default-logging
    ports:
      - '80:80'
      - '443:443'
    environment:
      INFRA_HOST: ${INFRA_HOST}
      MAILPIT_UI_PASSWORD_HASH: ${MAILPIT_UI_PASSWORD_HASH}
    volumes:
      # the directory, not the file: rsync and register-app.sh replace files with new inodes,
      # which a single-file bind mount never shows to the running container
      - ./caddy/:/etc/caddy/:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      default:
        # The applications' containers reach the issuer (https://${INFRA_HOST}/auth/realms/...)
        # through Caddy directly rather than through the public IP, with the Let's Encrypt cert.
        aliases:
          - ${INFRA_HOST}

  keycloak-db:
    image: postgres:18.6
    container_name: c4-infra.keycloak-db
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${KC_DB_PASSWORD}
      TZ: ${TZ}
    volumes:
      - keycloak_db:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -d keycloak -U keycloak']
      interval: 5s
      timeout: 5s
      retries: 20

  keycloak:
    # tagged with the content of keycloak/: unchanged by a push that doesn't touch it, so that
    # deployments don't restart the Keycloak every application uses (deploy-demo.yml)
    image: ${KC_IMAGE}
    container_name: c4-infra.keycloak
    restart: unless-stopped
    logging: *default-logging
    command:
      - start
      - --optimized
    environment:
      # As environment rather than --bootstrap-admin-* arguments: a command line is readable in
      # `docker inspect` and in the host's process list. Only read on the very first start.
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_BOOTSTRAP_ADMIN_USERNAME}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_BOOTSTRAP_ADMIN_PASSWORD}
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KC_DB_PASSWORD}
      KC_HOSTNAME: https://${INFRA_HOST}/auth/
      # the applications may call the admin API or the token endpoint on http://keycloak:8080/auth
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: 'true'
      KC_PROXY_HEADERS: xforwarded
      KC_HTTP_ENABLED: 'true'
      KC_LOG_LEVEL: ${KC_LOG_LEVEL}
      TZ: ${TZ}
    volumes:
      - ./keycloak/themes/:/opt/keycloak/themes/:ro
    healthcheck:
      # compiled into the image; a small JVM next to Keycloak's
      test: ['CMD', 'java', '-Xmx16m', '-XX:+UseSerialGC', '-XX:TieredStopAtLevel=1', '-cp', '/opt/keycloak/healthcheck', 'HealthCheck', 'http://localhost:9000/auth/health/ready']
      # fast while starting (a new version migrates its database first), then every 30 s: a probe
      # starts a process in the container
      start_period: 240s
      start_interval: 1s
      interval: 30s
      timeout: 10s
      retries: 3
    depends_on:
      keycloak-db:
        condition: service_healthy
    mem_limit: 1200m

  mailpit:
    image: axllent/mailpit:v1.31.0
    container_name: c4-infra.mailpit
    restart: unless-stopped
    logging: *default-logging
    volumes:
      - mailpit_data:/data
    environment:
      TZ: ${TZ}
      MP_MAX_MESSAGES: 5000
      MP_DATABASE: /data/mailpit.db
      # the realms' smtpServer credentials (each application renders them into its realm)
      MP_SMTP_AUTH: ${MAILPIT_SMTP_USER}:${MAILPIT_SMTP_PASSWORD}
      MP_SMTP_AUTH_ALLOW_INSECURE: 'true'
      MP_WEBROOT: /mailpit/

  rabbitmq:
    image: rabbitmq:4.3.5
    container_name: c4-infra.rabbitmq
    # RabbitMQ keeps its data under its node name, rabbit@<hostname>: fixed, so that a recreated
    # container finds the applications' virtual hosts, users and queues again
    hostname: rabbitmq
    restart: unless-stopped
    logging: *default-logging
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_ADMIN_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_ADMIN_PASSWORD}
      # one scheduler for the CLI tools (healthcheck, register-app.sh): their Erlang VM otherwise
      # busy-waits on every core
      RABBITMQ_CTL_ERL_ARGS: '+S 1'
      TZ: ${TZ}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'ping']
      # fast while starting, then every 30 s: a probe starts a process in the container
      start_period: 120s
      start_interval: 1s
      interval: 30s
      timeout: 10s
      retries: 3
    mem_limit: 400m

  grafana-lgtm:
    image: grafana/otel-lgtm:0.32.0
    container_name: c4-infra.grafana-lgtm
    restart: unless-stopped
    logging: *default-logging
    environment:
      GF_SERVER_ROOT_URL: https://${INFRA_HOST}/grafana
      GF_SERVER_SERVE_FROM_SUB_PATH: 'true'
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      # the image lets anonymous visitors in as Admin; on a public host, they log in
      GF_AUTH_ANONYMOUS_ENABLED: 'false'
    volumes:
      - grafana_data:/data
    mem_limit: 2g
