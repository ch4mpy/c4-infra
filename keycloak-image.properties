# The stack's Keycloak, for an application's tests (README.md, "Keycloak in an application's tests"):
# its version, its settings and features as keycloak/Dockerfile sets them, and the reference of its
# published image, which never moves. tests/0029-description.sh keeps it equal to keycloak/Dockerfile
# and to keycloak/'s tree. KEY=value lines, no quotes: bash sources it, Java reads it as properties.
KC_VERSION=26.8.1
KC_DB=postgres
KC_HTTP_RELATIVE_PATH=/auth
KC_HEALTH_ENABLED=true
KC_METRICS_ENABLED=true
KC_CACHE=local
KC_FEATURES=token-exchange-delegation,parameterized-scopes,cimd
KC_PUBLISHED_IMAGE=ghcr.io/ch4mpy/c4-infra-keycloak:26.8.1-33909cd89858
