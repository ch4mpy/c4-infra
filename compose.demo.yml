# The demo host's override of compose.yml (COMPOSE_FILE=compose.yml:compose.demo.yml:compose.apps.yml
# in the host's .env, written by demo/write-env.sh). Caddy alone is published, on 80 and 443 (a Let's
# Encrypt certificate per site); everything else is plain HTTP inside the Docker networks. The
# Keycloak image is the one the workflow pushed to GHCR (KC_IMAGE). Each application deploys its own
# compose project, whose containers join its own network c4-infra.<app>, and registers itself with
# ./register-app.sh, which attaches the shared services to that network (networks.sh). There the
# applications' containers reach the issuer (https://${INFRA_HOST}/auth/realms/...) through Caddy
# directly, under the shared host's name (compose.apps.yml), rather than through the public IP.
services:
  reverse-proxy:
    ports:
      - '80:80'
      - '443:443'

  keycloak-import:
    environment:
      # the master realm, when keycloak-import creates it (keycloak-import/master-realm.json, intents
      # 0009, 0012): Mailpit without TLS inside the Docker networks, and no "Forgot password" (its
      # mails land in Mailpit, where whoever reads them could reset an administrator's password)
      C4_MASTER_SMTP_HOST: mailpit
      C4_MASTER_SMTP_STARTTLS: 'false'
      C4_MASTER_RESET_PASSWORD_ALLOWED: 'false'
    mem_limit: 1200m

  keycloak:
    environment:
      # the applications may call the admin API or the token endpoint on http://keycloak:8080/auth
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: 'true'
    mem_limit: 1200m

  mailpit:
    environment:
      # SMTP without TLS, inside the Docker networks only
      MP_SMTP_AUTH_ALLOW_INSECURE: 'true'
      # Its web UI and API ask for the demo's credentials themselves, whether reached through Caddy
      # (/mailpit/) or from an application's container (intent 0007, RQ-04): user demo, the bcrypt
      # hash of its password (caddy hash-password). /livez and /readyz stay open, for its healthcheck.
      MP_UI_AUTH: demo:${MAILPIT_UI_PASSWORD_HASH}

  rabbitmq:
    mem_limit: 400m

  grafana-lgtm:
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      # the image lets anonymous visitors in as Admin; on a public host, they log in
      GF_AUTH_ANONYMOUS_ENABLED: 'false'
    mem_limit: 2g
