# The shared dev stack: one reverse proxy, Keycloak (on its own PostgreSQL), Mailpit, RabbitMQ and
# Grafana LGTM for every application of the machine. Started by ./up.sh; each application then
# registers its realm, its RabbitMQ virtual host and its reverse-proxy server with ./register-app.sh
# and runs its own database(s) in its own compose project. See README.md.
name: c4-infra

networks:
  default:
    # a fixed name: the applications' containers, if any, join it as an external network
    name: c4-infra

volumes:
  keycloak_db:
  mailpit_data:
  rabbitmq_data:
  grafana_data:

services:
  reverse-proxy:
    image: nginx:1.30.6
    container_name: c4-infra.reverse-proxy
    restart: unless-stopped
    ports:
      - 80:80
      - 443:443
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      # directories, not files: a script rewriting a file gives it a new inode, which a single-file
      # bind mount never shows to the running container
      - ./nginx/apps/:/etc/nginx/apps/:ro
      - ./nginx/html/:/usr/share/nginx/html/:ro
      - ./certs/:/etc/nginx/certs/:ro
    environment:
      TZ: ${TZ}
    extra_hosts:
      - host.docker.internal:host-gateway

  keycloak-db:
    image: postgres:18.6
    container_name: c4-infra.keycloak-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${KC_DB_PASSWORD}
      TZ: ${TZ}
    volumes:
      - keycloak_db:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -d keycloak -U keycloak']
      interval: 3s
      timeout: 5s
      retries: 20

  keycloak:
    # the Keycloak version is the Dockerfile's
    build: ./keycloak
    image: c4-infra/keycloak
    container_name: c4-infra.keycloak
    restart: unless-stopped
    # plain HTTP inside the Docker network: the reverse proxy is the only way in from the host
    command:
      - start
      - --optimized
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_BOOTSTRAP_ADMIN_USERNAME}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_BOOTSTRAP_ADMIN_PASSWORD}
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KC_DB_PASSWORD}
      # every realm's issuer is https://host.docker.internal/auth/realms/<realm>
      KC_HOSTNAME: https://${INFRA_HOST}/auth/
      KC_HTTP_ENABLED: 'true'
      KC_PROXY_HEADERS: xforwarded
      # back-channel logout calls the gateways on the host, which serve the CA certificate itself
      KC_TRUSTSTORE_PATHS: /opt/keycloak/certs/ca.crt
      KC_LOG_LEVEL: ${KC_LOG_LEVEL}
      TZ: ${TZ}
    volumes:
      - ./certs/ca.crt:/opt/keycloak/certs/ca.crt:ro
      - ./keycloak/themes/:/opt/keycloak/themes/:ro
    extra_hosts:
      - host.docker.internal:host-gateway
    healthcheck:
      # compiled into the image; a small JVM next to Keycloak's
      test: ['CMD', 'java', '-Xmx16m', '-XX:+UseSerialGC', '-XX:TieredStopAtLevel=1', '-cp', '/opt/keycloak/healthcheck', 'HealthCheck', 'http://localhost:9000/auth/health/ready']
      # fast while starting, then every 30 s: a probe starts a process in the container
      start_period: 120s
      start_interval: 1s
      interval: 30s
      timeout: 10s
      retries: 3
    depends_on:
      keycloak-db:
        condition: service_healthy

  mailpit:
    image: axllent/mailpit:v1.31.0
    container_name: c4-infra.mailpit
    restart: unless-stopped
    ports:
      - 1025:1025
      - 8025:8025
    volumes:
      - mailpit_data:/data
      - ./certs/:/opt/mailpit/certs/:ro
    environment:
      TZ: ${TZ}
      MP_MAX_MESSAGES: 5000
      MP_DATABASE: /data/mailpit.db
      # the realms' smtpServer credentials
      MP_SMTP_AUTH: ${MAILPIT_SMTP_USER}:${MAILPIT_SMTP_PASSWORD}
      MP_SMTP_TLS_CERT: /opt/mailpit/certs/tls.crt
      MP_SMTP_TLS_KEY: /opt/mailpit/certs/tls.key
      MP_WEBROOT: /mailpit/
      MP_UI_TLS_CERT: /opt/mailpit/certs/tls.crt
      MP_UI_TLS_KEY: /opt/mailpit/certs/tls.key

  rabbitmq:
    image: rabbitmq:4.3.5-management
    container_name: c4-infra.rabbitmq
    # RabbitMQ keeps its data under its node name, rabbit@<hostname>: fixed, so that a recreated
    # container finds the applications' virtual hosts, users and queues again
    hostname: rabbitmq
    restart: unless-stopped
    ports:
      - 5672:5672
      - 15672:15672
    environment:
      # the administrator only: each application has its own virtual host and user (register-app.sh)
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_ADMIN_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_ADMIN_PASSWORD}
      # one scheduler for the CLI tools (healthcheck, register-app.sh): their Erlang VM otherwise
      # busy-waits on every core
      RABBITMQ_CTL_ERL_ARGS: '+S 1'
      TZ: ${TZ}
    volumes:
      - ./rabbitmq/rabbitmq.conf:/etc/rabbitmq/conf.d/20-c4-infra.conf:ro
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'ping']
      # fast while starting, then every 30 s: a probe starts a process in the container
      start_period: 120s
      start_interval: 1s
      interval: 30s
      timeout: 10s
      retries: 3

  grafana-lgtm:
    image: grafana/otel-lgtm:0.32.0
    container_name: c4-infra.grafana-lgtm
    restart: unless-stopped
    ports:
      - 3000:3000
      - 4317:4317
      - 4318:4318
    environment:
      GF_SERVER_ROOT_URL: https://${INFRA_HOST}/grafana
      GF_SERVER_SERVE_FROM_SUB_PATH: 'true'
    volumes:
      - grafana_data:/data
