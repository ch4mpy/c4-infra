# The shared stack, in dev as on the demo host: one reverse proxy (Caddy), Keycloak on its own
# PostgreSQL, Mailpit, RabbitMQ and Grafana LGTM, for every application of the machine. Each
# application then registers its realm, its RabbitMQ virtual host and its site on the proxy with
# ./register-app.sh, and runs its own database(s) in its own compose project. See README.md.
#
# This is the base: every service and every image version, written once. COMPOSE_FILE (.env) adds the
# environment's override: compose.dev.yml on the workstation (./up.sh), compose.demo.yml on the demo
# host (.github/workflows/deploy-demo.yml). Published ports are declared in the overrides only:
# compose merges ports lists, so a port here would be published in both.
name: c4-infra

# The default json-file driver never rotates: on a host that runs for months this is the most
# likely way for the demo to fall over. Every service below references this anchor.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: 10m
    max-file: '3'

networks:
  default:
    # a fixed name: the shared services' own network, which no application joins (intent 0007). Each
    # application has its own, c4-infra.<app>: its registration creates it and attaches the shared
    # services but keycloak-db to it (networks.sh), compose.apps.yml (COMPOSE_FILE) keeps them there.
    name: c4-infra
  keycloak-db:
    # Keycloak's database, which only Keycloak reaches (intent 0007, RQ-03); no way out of it
    name: c4-infra.keycloak-db
    internal: true

volumes:
  caddy_data:
  caddy_config:
  keycloak_db:
  mailpit_data:
  rabbitmq_data:
  grafana_data:

services:
  reverse-proxy:
    image: caddy:2.11.4-alpine
    container_name: c4-infra.reverse-proxy
    restart: unless-stopped
    logging: *default-logging
    networks: [default]
    environment:
      INFRA_HOST: ${INFRA_HOST}
      # picks caddy/env/dev.caddy or caddy/env/demo.caddy, when Caddy starts: register-app.sh only
      # reloads it, and never changes that
      INFRA_ENV: ${INFRA_ENV}
      TZ: ${TZ}
    volumes:
      # the directory, not its files: git, rsync and register-app.sh replace files with new inodes,
      # which a single-file bind mount never shows to the running container
      - ./caddy/:/etc/caddy/:ro
      - caddy_data:/data
      - caddy_config:/config
    healthcheck:
      # Caddy's admin API, local to the container (the sites may wait for their certificates); on
      # 127.0.0.1, where it listens: wget would try localhost's ::1 first
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:2019/config/']
      start_period: 30s
      start_interval: 1s
      interval: 30s
      timeout: 5s
      retries: 3

  keycloak-db:
    image: postgres:18.6
    container_name: c4-infra.keycloak-db
    restart: unless-stopped
    logging: *default-logging
    # on Keycloak's network only: never on c4-infra nor on an application's network
    networks: [keycloak-db]
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${KC_DB_PASSWORD}
      TZ: ${TZ}
    volumes:
      - keycloak_db:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -d keycloak -U keycloak']
      interval: 5s
      timeout: 5s
      retries: 20

  keycloak:
    # built from keycloak/ in dev (compose.dev.yml: c4-infra/keycloak); on the demo host, the image
    # the workflow pushed to GHCR, tagged with the content of keycloak/, so that a deployment that
    # doesn't touch it doesn't restart the Keycloak every application uses
    image: ${KC_IMAGE}
    container_name: c4-infra.keycloak
    restart: unless-stopped
    logging: *default-logging
    networks: [default, keycloak-db]
    # plain HTTP inside the Docker network: the reverse proxy is the only way in from outside
    # --import-realm: the master realm is created from keycloak-import/master-realm.json on an empty
    # database (intent 0009); a realm that exists is never imported again
    command:
      - start
      - --optimized
      - --import-realm
    environment:
      # What the master realm's import reads (${NAME} in keycloak-import/master-realm.json), only
      # when Keycloak creates that realm. As environment rather than arguments: a command line is
      # readable in the host's process list. The administrator isn't KC_BOOTSTRAP_ADMIN_*, which
      # Keycloak would then create as well, and abort its start on that name (intent 0009).
      C4_MASTER_ADMIN_USERNAME: ${KC_BOOTSTRAP_ADMIN_USERNAME}
      C4_MASTER_ADMIN_PASSWORD: ${KC_BOOTSTRAP_ADMIN_PASSWORD}
      INFRA_HOST: ${INFRA_HOST}
      MAILPIT_SMTP_USER: ${MAILPIT_SMTP_USER}
      MAILPIT_SMTP_PASSWORD: ${MAILPIT_SMTP_PASSWORD}
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KC_DB_PASSWORD}
      # every realm's issuer is https://${INFRA_HOST}/auth/realms/<realm>
      KC_HOSTNAME: https://${INFRA_HOST}/auth/
      KC_HTTP_ENABLED: 'true'
      KC_PROXY_HEADERS: xforwarded
      KC_LOG_LEVEL: ${KC_LOG_LEVEL}
      TZ: ${TZ}
    volumes:
      - ./keycloak/themes/:/opt/keycloak/themes/:ro
      # the directory, not its file: rsync replaces files with new inodes; outside keycloak/, whose
      # content tags the demo host's image (a change here restarts nothing)
      - ./keycloak-import/:/opt/keycloak/data/import/:ro
    healthcheck:
      # compiled into the image; a small JVM next to Keycloak's
      test: ['CMD', 'java', '-Xmx16m', '-XX:+UseSerialGC', '-XX:TieredStopAtLevel=1', '-cp', '/opt/keycloak/healthcheck', 'HealthCheck', 'http://localhost:9000/auth/health/ready']
      # fast while starting (a new version migrates its database first), then every 30 s: a probe
      # starts a process in the container
      start_period: 240s
      start_interval: 1s
      interval: 30s
      timeout: 10s
      retries: 3
    depends_on:
      keycloak-db:
        condition: service_healthy

  mailpit:
    image: axllent/mailpit:v1.31.0
    container_name: c4-infra.mailpit
    restart: unless-stopped
    logging: *default-logging
    networks: [default]
    volumes:
      - mailpit_data:/data
    environment:
      TZ: ${TZ}
      MP_MAX_MESSAGES: 5000
      MP_DATABASE: /data/mailpit.db
      # the realms' smtpServer credentials (each application renders them into its realm)
      MP_SMTP_AUTH: ${MAILPIT_SMTP_USER}:${MAILPIT_SMTP_PASSWORD}
      # its UI over plain HTTP, behind the reverse proxy's /mailpit/
      MP_WEBROOT: /mailpit/

  rabbitmq:
    # without the management plugin (RabbitMQ's UI is dev's only: compose.dev.yml enables it)
    image: rabbitmq:4.3.5
    container_name: c4-infra.rabbitmq
    # RabbitMQ keeps its data under its node name, rabbit@<hostname>: fixed, so that a recreated
    # container finds the applications' virtual hosts, users and queues again
    hostname: rabbitmq
    restart: unless-stopped
    logging: *default-logging
    networks: [default]
    # its node name, rabbit@rabbitmq, resolves to the loopback first, where epmd and the Erlang
    # distribution listen (below): its own tools (rabbitmqctl, the healthcheck) reach it there
    extra_hosts:
      - rabbitmq:127.0.0.1
    environment:
      # the administrator only: each application has its own virtual host and user (register-app.sh)
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_ADMIN_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_ADMIN_PASSWORD}
      # one scheduler for the CLI tools (healthcheck, register-app.sh): their Erlang VM otherwise
      # busy-waits on every core
      RABBITMQ_CTL_ERL_ARGS: '+S 1'
      # epmd (4369) and the Erlang distribution (25672) on the container's loopback only (intent
      # 0007, RQ-10): behind its cookie, the distribution runs code in RabbitMQ; its tools run inside
      # the container. AMQP (5672) and the Prometheus metrics (15692) stay on every interface.
      ERL_EPMD_ADDRESS: 127.0.0.1
      RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS: '-kernel inet_dist_use_interface {127,0,0,1}'
      TZ: ${TZ}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'ping']
      # fast while starting, then every 30 s: a probe starts a process in the container
      start_period: 120s
      start_interval: 1s
      interval: 30s
      timeout: 10s
      retries: 3

  grafana-lgtm:
    image: grafana/otel-lgtm:0.32.0
    container_name: c4-infra.grafana-lgtm
    restart: unless-stopped
    logging: *default-logging
    networks: [default]
    environment:
      GF_SERVER_ROOT_URL: https://${INFRA_HOST}/grafana
      GF_SERVER_SERVE_FROM_SUB_PATH: 'true'
      # Its components' internal ports on the container's loopback only (intent 0007, RQ-11):
      # Loki's gRPC (9095), Tempo's (9096), Pyroscope's (9097) and its memberlist (7946), the
      # collector's health check (13133). Every component's start script appends its *_EXTRA_ARGS,
      # split on spaces (no value may hold one). Pyroscope's components dial each other at their
      # ring addresses, the container's own by default: on 127.0.0.1 too, or its ingest fails. Tempo
      # has no flag for its gRPC address: a copy of the image's file, which wins as the second
      # -config.file (grafana-lgtm/tempo-config.yaml, to regenerate with each image upgrade).
      # tests/0007-lgtm.sh checks the ports and that logs, traces, metrics and profiles still flow.
      LOKI_EXTRA_ARGS: -server.grpc-listen-address=127.0.0.1
      TEMPO_EXTRA_ARGS: -config.file=/etc/c4-infra/grafana-lgtm/tempo-config.yaml
      PYROSCOPE_EXTRA_ARGS: -server.grpc-listen-address=127.0.0.1 -memberlist.bind-addr=127.0.0.1 -memberlist.advertise-addr=127.0.0.1 -segment-writer.lifecycler.addr=127.0.0.1 -distributor.ring.instance-addr=127.0.0.1 -query-frontend.instance-addr=127.0.0.1
      OTELCOL_EXTRA_ARGS: --set=extensions::health_check::endpoint=127.0.0.1:13133
    volumes:
      - grafana_data:/data
      # the directory, not the file (git and rsync replace files with new inodes)
      - ./grafana-lgtm/:/etc/c4-infra/grafana-lgtm/:ro
