worker_processes  auto;
error_log  /var/log/nginx/error.log warn;
pid        /tmp/nginx.pid;
events {
  worker_connections  1024;
}
http {
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path       /tmp/proxy_temp_path;
  fastcgi_temp_path     /tmp/fastcgi_temp;
  uwsgi_temp_path       /tmp/uwsgi_temp;
  scgi_temp_path        /tmp/scgi_temp;
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  log_format  main  '$host $remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
  access_log  /var/log/nginx/access.log  main;
  sendfile        on;
  keepalive_timeout  65;

  gzip            on;
  gzip_static     on;
  gzip_vary       on;
  gzip_proxied    no-cache no-store private expired auth;
  gzip_min_length 10240;
  gzip_types
  application/javascript
  application/json
  font/woff2
  text/css
  text/plain;
  proxy_buffering off;
  proxy_http_version 1.1;
  proxy_intercept_errors on;
  proxy_read_timeout 86400;
  proxy_request_buffering off;
  proxy_set_header Host $host;
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection "upgrade";
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;

  # Docker's embedded DNS. The shared services are proxied through variables, so that their names
  # are resolved per request: the proxy starts, and keeps serving the applications, whichever of
  # them is down.
  resolver 127.0.0.11 valid=10s ipv6=off;

  # One leaf for every server: host.docker.internal, localhost and *.dev.localhost (certs/make-certs.sh)
  ssl_certificate     /etc/nginx/certs/tls.crt;
  ssl_certificate_key /etc/nginx/certs/tls.key;

  # The shared services, on https://host.docker.internal/
  server {
    server_name host.docker.internal localhost;

    listen [::]:443 ssl default_server ipv6only=on;
    listen 443 ssl default_server;

    location = / {
      root /usr/share/nginx/html;
      try_files /index.html =404;
    }

    # proxy_pass with a variable and no URI forwards the request URI as the client sent it: each
    # service is configured to live under its own prefix
    location /auth/ {
      set $keycloak keycloak;
      proxy_pass http://$keycloak:8080;
    }

    # RFC 8414 discovery, which MCP clients use: the well-known path is inserted before the
    # issuer's path, on the issuer's host (this one), for every realm (a realm name's characters
    # only: the capture goes into the upstream request line)
    location ~ ^/\.well-known/(?<document>oauth-authorization-server|openid-configuration)/auth/realms/(?<realm>[A-Za-z0-9_.-]+)$ {
      set $keycloak keycloak;
      proxy_pass http://$keycloak:8080/auth/realms/$realm/.well-known/$document;
    }

    location /mailpit/ {
      set $mailpit mailpit;
      proxy_pass https://$mailpit:8025;
      proxy_ssl_verify off;
    }

    location /grafana/ {
      set $grafana grafana-lgtm;
      proxy_pass http://$grafana:3000;
    }

    location /rabbitmq/ {
      set $rabbitmq rabbitmq;
      proxy_pass http://$rabbitmq:15672;
    }
  }

  # One server per registered application, on its own host name (https://<app>.dev.localhost/):
  # installed by register-app.sh, from the application's repository.
  include /etc/nginx/apps/*.conf;

  server {
    listen 80 default_server;
    listen [::]:80 default_server;

    return 301 https://$host$request_uri;
  }
}
