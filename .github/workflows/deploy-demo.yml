# Builds the shared Keycloak image, publishes it to GHCR, then deploys the shared stack on the demo
# VPS with Docker Compose (see README.md for the one-time setup and the secrets). The applications
# deploy themselves, with their own workflows, on top of it.
name: Deploy demo

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - '.claude/**'
  workflow_dispatch:

concurrency:
  group: deploy-demo
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  build:
    name: Build and push the Keycloak and proxy images
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.image }}
      proxy_image: ${{ steps.image.outputs.proxy_image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Each tagged with the content of its directory (its git tree, the version of its Dockerfile
      # included): a push that doesn't touch keycloak/ keeps Keycloak's image, so the deployment
      # doesn't restart the Keycloak every application uses; the same for reverse-proxy/ (Caddy with
      # its rate-limit module, intent 0013). GHCR wants a lowercase owner.
      - name: Compute the images
        id: image
        run: |
          echo "image=$REGISTRY/${GITHUB_REPOSITORY_OWNER,,}/c4-infra-keycloak:$(git rev-parse --short=12 HEAD:keycloak)" >> "$GITHUB_OUTPUT"
          echo "proxy_image=$REGISTRY/${GITHUB_REPOSITORY_OWNER,,}/c4-infra-reverse-proxy:$(git rev-parse --short=12 HEAD:reverse-proxy)" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Look for the images in GHCR
        id: existing
        run: |
          if docker manifest inspect "$KC_IMAGE" > /dev/null 2>&1; then
            echo "keycloak=true" >> "$GITHUB_OUTPUT"
          fi
          if docker manifest inspect "$PROXY_IMAGE" > /dev/null 2>&1; then
            echo "proxy=true" >> "$GITHUB_OUTPUT"
          fi
        env:
          KC_IMAGE: ${{ steps.image.outputs.image }}
          PROXY_IMAGE: ${{ steps.image.outputs.proxy_image }}

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        if: steps.existing.outputs.keycloak != 'true' || steps.existing.outputs.proxy != 'true'

      - name: Push c4-infra-keycloak
        if: steps.existing.outputs.keycloak != 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: keycloak
          push: true
          tags: ${{ steps.image.outputs.image }}
          pull: true

      - name: Push c4-infra-reverse-proxy
        if: steps.existing.outputs.proxy != 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: reverse-proxy
          push: true
          tags: ${{ steps.image.outputs.proxy_image }}
          pull: true

  deploy:
    name: Deploy on the VPS
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: demo
    permissions:
      contents: read
      packages: read
    env:
      INFRA_HOST: ${{ vars.INFRA_HOST || 'infra.c4-soft.com' }}
      VPS: c4-infra@${{ secrets.VPS_HOST }}
      KC_IMAGE: ${{ needs.build.outputs.image }}
      PROXY_IMAGE: ${{ needs.build.outputs.proxy_image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Trust the VPS host key
        # Before the agent receives the private key and before any connection: the VPS_KNOWN_HOSTS
        # secret holds the host's known_hosts line(s), so that a host answering with another key
        # fails the deployment instead of receiving its secrets. Without it, the deployment fails
        # here (demo/trust-host-key.sh): no trust on first use.
        run: bash demo/trust-host-key.sh
        env:
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}

      - name: Write the compose .env
        # demo/write-env.sh fails by name when a secret is missing, and leaves .env in mode 600,
        # before anything is uploaded
        run: bash demo/write-env.sh .env
        env:
          KC_ADMIN_USERNAME: ${{ vars.KC_ADMIN_USERNAME }}
          KC_ADMIN_PASSWORD: ${{ secrets.KC_ADMIN_PASSWORD }}
          KC_DB_PASSWORD: ${{ secrets.KC_DB_PASSWORD }}
          # the registration account's secret (docs/demo-setup.md, "Rotating the registration secret")
          KC_REGISTRATION_CLIENT_SECRET: ${{ secrets.KC_REGISTRATION_CLIENT_SECRET }}
          RABBITMQ_ADMIN_PASSWORD: ${{ secrets.RABBITMQ_ADMIN_PASSWORD }}
          MAILPIT_SMTP_PASSWORD: ${{ secrets.MAILPIT_SMTP_PASSWORD }}
          MAILPIT_UI_PASSWORD_HASH: ${{ secrets.MAILPIT_UI_PASSWORD_HASH }}
          GRAFANA_ADMIN_PASSWORD: ${{ secrets.GRAFANA_ADMIN_PASSWORD }}

      # Pinned by commit, as every action of this workflow: it receives the private key
      - uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555 # v0.10.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      - name: Upload the deployment files
        # Exactly the files of demo/deploy-files.txt (the compose base and its demo override, the
        # shared Caddy configuration, the registry, the registration and the host's scripts), then
        # .env (mode 600, kept by -a). Never --delete: caddy/apps/ and keycloak/themes/ hold what the
        # applications registered.
        run: |
          rsync -az --files-from=demo/deploy-files.txt ./ "$VPS:~/c4-infra/"
          rsync -az .env "$VPS:~/c4-infra/.env"

      - name: Pull and restart the stack
        run: |
          # The administrator demo/deploy.sh logs in as when the registration account must be created
          # or repaired once the bootstrap administrator is gone: optional secrets, set for one
          # deployment (docs/demo-setup.md). Base64 here, decoded on the host: any character survives
          # the heredoc's quoting (printf is a builtin there: still on no command line).
          setup_user=$(printf '%s' "$KC_SETUP_ADMIN_USERNAME" | base64 -w0)
          setup_password=$(printf '%s' "$KC_SETUP_ADMIN_PASSWORD" | base64 -w0)
          # unquoted heredoc: the credentials are expanded here and travel on stdin, not on a
          # command line visible in the VPS process list
          ssh "$VPS" bash -s <<EOT
          set -euo pipefail
          cd ~/c4-infra
          echo '$GHCR_TOKEN' | docker login ghcr.io -u '$GHCR_USER' --password-stdin
          # compose.apps.yml, the last file of COMPOSE_FILE: the applications' networks (intent 0007)
          bash ./networks.sh compose-file
          docker compose pull --quiet
          docker logout ghcr.io
          KC_SETUP_ADMIN_USERNAME=\$(printf '%s' '$setup_user' | base64 -d)
          KC_SETUP_ADMIN_PASSWORD=\$(printf '%s' '$setup_password' | base64 -d)
          export KC_SETUP_ADMIN_USERNAME KC_SETUP_ADMIN_PASSWORD
          # starts the stack, reloads Caddy, makes sure of the registration account, installs the
          # nightly backup (demo/deploy.sh)
          bash ./demo/deploy.sh < /dev/null
          EOT
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          KC_SETUP_ADMIN_USERNAME: ${{ secrets.KC_SETUP_ADMIN_USERNAME }}
          KC_SETUP_ADMIN_PASSWORD: ${{ secrets.KC_SETUP_ADMIN_PASSWORD }}
