# Builds the shared Keycloak image, publishes it to GHCR, then deploys the shared stack on the demo
# VPS with Docker Compose (see README.md for the one-time setup and the secrets). The applications
# deploy themselves, with their own workflows, on top of it.
name: Deploy demo

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - '.claude/**'
  workflow_dispatch:

concurrency:
  group: deploy-demo
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  build:
    name: Build and push the Keycloak image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.image }}
    steps:
      - uses: actions/checkout@v7

      # Tagged with the content of keycloak/ (its git tree, the Keycloak version of the Dockerfile
      # included): a push that doesn't touch it keeps the image, so the deployment doesn't restart
      # the Keycloak every application uses. GHCR wants a lowercase owner.
      - name: Compute the Keycloak image
        id: image
        run: echo "image=$REGISTRY/${GITHUB_REPOSITORY_OWNER,,}/c4-infra-keycloak:$(git rev-parse --short=12 HEAD:keycloak)" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Look for the image in GHCR
        id: existing
        run: |
          if docker manifest inspect "$KC_IMAGE" > /dev/null 2>&1; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          fi
        env:
          KC_IMAGE: ${{ steps.image.outputs.image }}

      - uses: docker/setup-buildx-action@v4
        if: steps.existing.outputs.found != 'true'

      - name: Push c4-infra-keycloak
        if: steps.existing.outputs.found != 'true'
        uses: docker/build-push-action@v7
        with:
          context: keycloak
          push: true
          tags: ${{ steps.image.outputs.image }}
          pull: true

  deploy:
    name: Deploy on the VPS
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: demo
    permissions:
      contents: read
      packages: read
    env:
      INFRA_HOST: ${{ vars.INFRA_HOST || 'infra.c4-soft.com' }}
      VPS: deploy@${{ secrets.VPS_HOST }}
      KC_IMAGE: ${{ needs.build.outputs.image }}
    steps:
      - uses: actions/checkout@v7

      - name: Write the compose .env
        # demo/write-env.sh fails by name when a secret is missing, and leaves .env in mode 600,
        # before anything is uploaded
        run: bash demo/write-env.sh .env
        env:
          KC_ADMIN_USERNAME: ${{ vars.KC_ADMIN_USERNAME }}
          KC_ADMIN_PASSWORD: ${{ secrets.KC_ADMIN_PASSWORD }}
          KC_DB_PASSWORD: ${{ secrets.KC_DB_PASSWORD }}
          # the registration account's secret (docs/demo-setup.md, "Rotating the registration secret")
          KC_REGISTRATION_CLIENT_SECRET: ${{ secrets.KC_REGISTRATION_CLIENT_SECRET }}
          RABBITMQ_ADMIN_PASSWORD: ${{ secrets.RABBITMQ_ADMIN_PASSWORD }}
          MAILPIT_SMTP_PASSWORD: ${{ secrets.MAILPIT_SMTP_PASSWORD }}
          MAILPIT_UI_PASSWORD_HASH: ${{ secrets.MAILPIT_UI_PASSWORD_HASH }}
          GRAFANA_ADMIN_PASSWORD: ${{ secrets.GRAFANA_ADMIN_PASSWORD }}

      - uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      - name: Trust the VPS host key
        # Pinned when the VPS_KNOWN_HOSTS secret holds the host's known_hosts line(s), so that a
        # host answering with another key fails the deployment instead of receiving every secret.
        # Without it, trust-on-first-use on each run (the runner is new every time).
        run: |
          if [ -n "$VPS_KNOWN_HOSTS" ]; then
            printf '%s\n' "$VPS_KNOWN_HOSTS" >> ~/.ssh/known_hosts
          else
            echo "::warning::VPS_KNOWN_HOSTS is not set: trusting whatever host key $VPS_HOST presents"
            ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts
          fi
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}

      - name: Upload the deployment files
        # Exactly the files of demo/deploy-files.txt (the compose base and its demo override, the
        # shared Caddy configuration, the registry, the registration and the host's scripts), then
        # .env (mode 600, kept by -a). Never --delete: caddy/apps/ and keycloak/themes/ hold what the
        # applications registered.
        run: |
          rsync -az --files-from=demo/deploy-files.txt ./ "$VPS:~/c4-infra/"
          rsync -az .env "$VPS:~/c4-infra/.env"

      - name: Pull and restart the stack
        run: |
          # The administrator demo/deploy.sh logs in as when the registration account must be created
          # or repaired once the bootstrap administrator is gone: optional secrets, set for one
          # deployment (docs/demo-setup.md). Base64 here, decoded on the host: any character survives
          # the heredoc's quoting (printf is a builtin there: still on no command line).
          setup_user=$(printf '%s' "$KC_SETUP_ADMIN_USERNAME" | base64 -w0)
          setup_password=$(printf '%s' "$KC_SETUP_ADMIN_PASSWORD" | base64 -w0)
          # unquoted heredoc: the credentials are expanded here and travel on stdin, not on a
          # command line visible in the VPS process list
          ssh "$VPS" bash -s <<EOT
          set -euo pipefail
          cd ~/c4-infra
          echo '$GHCR_TOKEN' | docker login ghcr.io -u '$GHCR_USER' --password-stdin
          docker compose pull --quiet
          docker logout ghcr.io
          KC_SETUP_ADMIN_USERNAME=\$(printf '%s' '$setup_user' | base64 -d)
          KC_SETUP_ADMIN_PASSWORD=\$(printf '%s' '$setup_password' | base64 -d)
          export KC_SETUP_ADMIN_USERNAME KC_SETUP_ADMIN_PASSWORD
          # starts the stack, reloads Caddy, makes sure of the registration account, installs the
          # nightly backup (demo/deploy.sh)
          bash ./demo/deploy.sh < /dev/null
          EOT
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          KC_SETUP_ADMIN_USERNAME: ${{ secrets.KC_SETUP_ADMIN_USERNAME }}
          KC_SETUP_ADMIN_PASSWORD: ${{ secrets.KC_SETUP_ADMIN_PASSWORD }}
