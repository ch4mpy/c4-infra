# Added to COMPOSE_FILE on the stand-in host only (tests/lib/stand-in-host.sh, stand_in_env): Docker's
# DNS forwards every name outside the network to a resolver that doesn't exist, so that Caddy can't
# reach Let's Encrypt from a test. The containers' own names still resolve. Caddy issues every site's
# certificate from its local authority instead: the stand-in image's caddy-env/ over the stack's
# caddy/env/, the stack's own env/ beside it, which caddy-env/demo.caddy imports.
services:
  reverse-proxy:
    dns: [127.0.0.1]
    volumes:
      - /etc/c4-stand-in/caddy-env/:/etc/caddy/env/:ro
      - ./caddy/env/:/etc/caddy-stack-env/:ro
