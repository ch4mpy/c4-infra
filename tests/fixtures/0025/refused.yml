# 0025 fixture (tests/0025-refused-stage.stand-in.sh): mounted.yml with a published port, which sudo
# c4-app up and pull refuse
services:
  gateway:
    image: caddy:2.11.4-alpine
    container_name: faito.gateway
    command: [caddy, respond, --listen, ':7080', faito.gateway]
    networks: [c4-infra.faito]
    ports: ['7080:7080']
    volumes:
      - ./content:/srv/content:ro
networks:
  c4-infra.faito:
    external: true
