# 0027 fixture (tests/0027-isolation.stand-in.sh): Hurura'a's data, declared for its backups: db, a
# PostgreSQL labelled postgres; files, a Caddy labelled volumes on files_data (Faito's key too)
services:
  db:
    image: postgres:18.6
    container_name: hururaa.db
    environment:
      POSTGRES_USER: fixture-user
      POSTGRES_DB: fixture-db
      POSTGRES_HOST_AUTH_METHOD: trust
    labels:
      c4-infra.backup: postgres
    networks: [c4-infra.hururaa]
    volumes: [db_data:/var/lib/postgresql]
    healthcheck:
      test: [CMD, pg_isready, -q, -h, 127.0.0.1, -U, fixture-user, -d, fixture-db]
      interval: 1s
      retries: 60
  files:
    image: caddy:2.11.4-alpine
    container_name: hururaa.files
    command: [caddy, file-server, --root, /srv, --listen, ':7080']
    labels:
      c4-infra.backup: volumes
    networks: [c4-infra.hururaa]
    volumes: [files_data:/srv]
networks:
  c4-infra.hururaa:
    external: true
volumes:
  db_data: {}
  files_data: {}
