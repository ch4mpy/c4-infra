# 0033 fixture (tests/0033-backup-paths.stand-in.sh): data.yml and bare, labelled volumes, which mounts a
# tmpfs and no named volume of the project: a backup and a restore refuse it, naming it (AC-07)
services:
  db:
    image: postgres:18.6
    container_name: faito.db
    environment:
      POSTGRES_USER: fixture-user
      POSTGRES_DB: fixture-db
      POSTGRES_HOST_AUTH_METHOD: trust
    labels:
      c4-infra.backup: postgres
    networks: [c4-infra.faito]
    volumes: [db_data:/var/lib/postgresql]
    healthcheck:
      test: [CMD, pg_isready, -q, -h, 127.0.0.1, -U, fixture-user, -d, fixture-db]
      interval: 1s
      retries: 60
  files:
    image: caddy:2.11.4-alpine
    container_name: faito.files
    command: [caddy, file-server, --root, /srv, --listen, ':7080']
    labels:
      c4-infra.backup: volumes
    networks: [c4-infra.faito]
    volumes: [files_data:/srv]
  other:
    image: caddy:2.11.4-alpine
    container_name: faito.other
    command: [caddy, respond, --listen, ':7080', other]
    networks: [c4-infra.faito]
    volumes: [cache:/cache]
  bare:
    image: caddy:2.11.4-alpine
    container_name: faito.bare
    command: [caddy, respond, --listen, ':7080', bare]
    labels:
      c4-infra.backup: volumes
    networks: [c4-infra.faito]
    tmpfs: [/data]
networks:
  c4-infra.faito:
    external: true
volumes:
  db_data: {}
  files_data: {}
  cache: {}
