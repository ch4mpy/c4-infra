# 0033 fixture (tests/0033-backup-paths.stand-in.sh): data.yml and l1, l2, l3, each healthy 5 s after
# its start (its mark removed first: a restart keeps the container's files), l2 service_healthy on l1,
# l3 on l2: a restore starts them again layer by layer (AC-09)
services:
  db:
    image: postgres:18.6
    container_name: faito.db
    environment:
      POSTGRES_USER: fixture-user
      POSTGRES_DB: fixture-db
      POSTGRES_HOST_AUTH_METHOD: trust
    labels:
      c4-infra.backup: postgres
    networks: [c4-infra.faito]
    volumes: [db_data:/var/lib/postgresql]
    healthcheck:
      test: [CMD, pg_isready, -q, -h, 127.0.0.1, -U, fixture-user, -d, fixture-db]
      interval: 1s
      retries: 60
  files:
    image: caddy:2.11.4-alpine
    container_name: faito.files
    command: [caddy, file-server, --root, /srv, --listen, ':7080']
    labels:
      c4-infra.backup: volumes
    networks: [c4-infra.faito]
    volumes: [files_data:/srv]
  other:
    image: caddy:2.11.4-alpine
    container_name: faito.other
    command: [caddy, respond, --listen, ':7080', other]
    networks: [c4-infra.faito]
    volumes: [cache:/cache]
  l1:
    image: caddy:2.11.4-alpine
    container_name: faito.l1
    command: [sh, -c, 'rm -f /tmp/ready; sleep 5; touch /tmp/ready; exec caddy respond --listen :7080 l1']
    networks: [c4-infra.faito]
    healthcheck:
      test: [CMD, test, -f, /tmp/ready]
      interval: 1s
      retries: 60
  l2:
    image: caddy:2.11.4-alpine
    container_name: faito.l2
    command: [sh, -c, 'rm -f /tmp/ready; sleep 5; touch /tmp/ready; exec caddy respond --listen :7080 l2']
    networks: [c4-infra.faito]
    depends_on:
      l1:
        condition: service_healthy
    healthcheck:
      test: [CMD, test, -f, /tmp/ready]
      interval: 1s
      retries: 60
  l3:
    image: caddy:2.11.4-alpine
    container_name: faito.l3
    command: [sh, -c, 'rm -f /tmp/ready; sleep 5; touch /tmp/ready; exec caddy respond --listen :7080 l3']
    networks: [c4-infra.faito]
    depends_on:
      l2:
        condition: service_healthy
    healthcheck:
      test: [CMD, test, -f, /tmp/ready]
      interval: 1s
      retries: 60
networks:
  c4-infra.faito:
    external: true
volumes:
  db_data: {}
  files_data: {}
  cache: {}
