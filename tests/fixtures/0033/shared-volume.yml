# 0033 fixture (tests/0033-backup-paths.stand-in.sh): db, labelled postgres, and files, labelled
# volumes, both mount shared; files mounts files_data too: shared is archived once, under files, and
# both containers stop while it is copied (AC-08)
services:
  db:
    image: postgres:18.6
    container_name: faito.db
    environment:
      POSTGRES_USER: fixture-user
      POSTGRES_DB: fixture-db
      POSTGRES_HOST_AUTH_METHOD: trust
    labels:
      c4-infra.backup: postgres
    networks: [c4-infra.faito]
    volumes: [db_data:/var/lib/postgresql, shared:/shared]
    healthcheck:
      test: [CMD, pg_isready, -q, -h, 127.0.0.1, -U, fixture-user, -d, fixture-db]
      interval: 1s
      retries: 60
  files:
    image: caddy:2.11.4-alpine
    container_name: faito.files
    command: [caddy, file-server, --root, /srv, --listen, ':7080']
    labels:
      c4-infra.backup: volumes
    networks: [c4-infra.faito]
    volumes: [files_data:/srv, shared:/shared]
networks:
  c4-infra.faito:
    external: true
volumes:
  db_data: {}
  files_data: {}
  shared: {}
