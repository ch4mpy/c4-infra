# verif-ok: what a theme may hold (tests/0012-themes.sh): the twins of the forms a registration refuses.
# A comment may name ${env.KC_DB_PASSWORD}: Keycloak reads no comment.
! Nor does a comment ending with a backslash continue on the next line: ${java.version} \
parent=keycloak
# An even number of backslashes ends the line: the value is x$\ and the next line is a key of its own
verifTwin=x$\
{env.KC_DB_PASSWORD}=y
styles=css/verif.css
