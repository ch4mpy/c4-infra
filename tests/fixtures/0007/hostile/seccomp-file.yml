# 0007 fixture (tests/0007-compose-check.stand-in.sh): security_opt: seccomp=<file>, a profile that may be more permissive than the default,
# which sudo c4-app up refuses before any container starts (review round 1, 2026-10-22)
services:
  gateway:
    image: caddy:2.11.4-alpine
    container_name: faito.gateway
    command: [caddy, respond, --listen, ':7080', faito.gateway]
    networks: [c4-infra.faito]
    security_opt: [seccomp=/var/lib/c4-apps/faito/compose.yml]
networks:
  c4-infra.faito:
    external: true
