# 0007 fixture (tests/0007-compose-check.stand-in.sh): a read-write bind mount, through which the container (root inside) rewrites its own staged files,
# which sudo c4-app up refuses before any container starts (review round 1, 2026-10-22)
services:
  gateway:
    image: caddy:2.11.4-alpine
    container_name: faito.gateway
    command: [caddy, respond, --listen, ':7080', faito.gateway]
    networks: [c4-infra.faito]
    volumes:
      - ./compose.yml:/srv/compose.yml
networks:
  c4-infra.faito:
    external: true
