# 0007 fixture (tests/0007-compose-check.stand-in.sh): a build whose dockerfile climbs out of the context with ..,
# which sudo c4-app up refuses before any container starts (review round 1, 2026-10-22)
services:
  gateway:
    image: caddy:2.11.4-alpine
    container_name: faito.gateway
    command: [caddy, respond, --listen, ':7080', faito.gateway]
    networks: [c4-infra.faito]
    build:
      context: .
      dockerfile: ../../c4-app.model.json
networks:
  c4-infra.faito:
    external: true
