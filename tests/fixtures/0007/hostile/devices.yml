# 0007 fixture (tests/0007-compose-check.stand-in.sh): Faito's compose.yml with a device of the host (an escape of RQ-09's kind),
# which sudo c4-app up refuses before any container starts
services:
  gateway:
    image: caddy:2.11.4-alpine
    container_name: faito.gateway
    command: [caddy, respond, --listen, ':7080', faito.gateway]
    networks: [c4-infra.faito]
    devices: [/dev/kmsg:/dev/kmsg]
networks:
  c4-infra.faito:
    external: true
